    <script>
      // EASE / DUR pasted from packet Tokens/easings/voice section.
      const EASE = {
        entry: "power2.out",
        emphasis: "power3.out",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 0.95,
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Initial hidden / staged states (gsap.set, not CSS opacity:0).
      gsap.set("#s5-card-wrap", { opacity: 0, y: -34, scale: 0.96 });
      gsap.set("#s5-pin", { opacity: 0, y: -28, rotation: 26, scale: 0.7 });
      gsap.set("#s5-cta", { opacity: 0, y: 18 });
      gsap.set("#s5-attribution", { opacity: 0, y: 10 });
      gsap.set("#s5-wireframe", { opacity: 0 });

      // Phase 1 — card-morph-anchor: card slides in (entry, 0 -> DUR.slow).
      tl.fromTo(
        "#s5-card-wrap",
        { opacity: 0, y: -34, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: DUR.slow, ease: EASE.entry },
        0,
      );

      // Stillness-before-climax: 0.5s suspended hold after the slide settles,
      // before the pin slams down. No tweens fire in this window.
      const HOLD_END = DUR.slow + 0.5; // ~1.45s

      // Phase 2 — press-release-spring (no bounce per system rule): pin slams
      // down with confident non-bouncy settle, landing exactly as the CTA lands.
      const PIN_DUR = 0.42;
      const CTA_LAND = HOLD_END + PIN_DUR; // pin settle completes == CTA arrival

      tl.fromTo(
        "#s5-pin",
        { opacity: 0, y: -28, rotation: 26, scale: 0.7 },
        {
          opacity: 1,
          y: 0,
          rotation: -10,
          scale: 1,
          duration: PIN_DUR,
          ease: EASE.emphasis,
        },
        HOLD_END,
      );

      // Tiny compression "thud" on the card as the pin lands (press-release-spring
      // input phase, linear compression, then settle — non-bouncy per system rule).
      tl.to(
        "#s5-card",
        { y: 3, duration: 0.08, ease: "power1.in" },
        HOLD_END + PIN_DUR - 0.08,
      );
      tl.to(
        "#s5-card",
        { y: 0, duration: DUR.med, ease: EASE.emphasis },
        HOLD_END + PIN_DUR,
      );

      // CTA line lands exactly as the pin slams down.
      tl.fromTo(
        "#s5-cta",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.emphasis },
        CTA_LAND,
      );

      // card-morph-anchor: completed wireframe fades up gently behind, confirming
      // closure (full-circle callback to scene 1 — no more tear).
      tl.to(
        "#s5-wireframe",
        { opacity: 0.5, duration: DUR.slow, ease: "power2.inOut" },
        CTA_LAND,
      );

      // Mono attribution settles in last — closing source tag.
      tl.fromTo(
        "#s5-attribution",
        { opacity: 0, y: 10 },
        { opacity: 0.65, y: 0, duration: DUR.med, ease: EASE.entry },
        CTA_LAND + 0.25,
      );

      // Macro: slow settle-and-hold — no further drift after this beat (closing
      // scene). Composition holds on the final stable frame; film's end, no
      // outgoing transition per dispatch.

      window.__timelines["scene_5"] = tl;
