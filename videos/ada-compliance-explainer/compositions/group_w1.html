    <script>
      (async function () {
        const EASE = {
          entry: "power2.out",
          emphasis: "power3.out",
          exit: "power2.in",
          drift: "sine.inOut",
        };
        const DUR = {
          snap: 0.18,
          med: 0.5,
          slow: 0.95,
        };

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const T = { scene_1: 0, scene_2: 6.037, scene_3: 13.546 };

        // ---------------- initial hidden states ----------------
        gsap.set("#s1-hero-number", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" });
        gsap.set("#s1-pin", { rotation: -10, transformOrigin: "50% 50%" });
        gsap.set("#s1-tear-fragment", { x: 0, y: 0, opacity: 1 });
        gsap.set(["#s1-wf-1", "#s1-wf-2", "#s1-wf-3", "#s1-wf-4", "#s1-wf-5", "#s1-wf-6", "#s1-wf-7", "#s1-wf-8"], {
          opacity: 1,
        });
        gsap.set(".s1-scribble", { opacity: 0, clipPath: "inset(0 100% 0 0)" });

        gsap.set("#g1-term-card", { opacity: 0, y: 24 });
        gsap.set(["#s2-stamp-1", "#s2-stamp-2", "#s2-stamp-3"], { opacity: 0, y: 20, scale: 0.92 });
        gsap.set("#s2-counter-card", { opacity: 0, y: 16 });
        gsap.set("#s2-scribble", { opacity: 0, clipPath: "inset(0 100% 0 0)" });
        gsap.set("#s2-zoom-outer", { scale: 1 });
        gsap.set("#s2-zoom-inner", { x: 0, y: 0 });

        gsap.set(["#s3-step-1", "#s3-step-2", "#s3-step-3"], { opacity: 0, y: 22 });
        gsap.set("#s3-scribble", { opacity: 0, y: 14 });

        // scene_1 is a break-start, not part of the continuity chain into scene_2/3 —
        // it must vacate the stage before scene_2 begins (handoff, no overlap)

        // ---------------- SVG path-draw setup (scene 1 wireframe) ----------------
        const wfPaths = document.querySelectorAll(
          "#s1-wf-1, #s1-wf-2, #s1-wf-3, #s1-wf-4, #s1-wf-5, #s1-wf-6, #s1-wf-7, #s1-wf-8",
        );
        wfPaths.forEach((p) => {
          const len = p.getTotalLength();
          p.style.strokeDasharray = `${len}`;
          p.style.strokeDashoffset = `${len}`;
        });

        // ================= SCENE 1: torn wireframe (0 - 6.037s) =================
        const S1 = T.scene_1;

        // Wireframe draws in, staggered ~70-80% overlap
        const wfSeq = ["#s1-wf-1", "#s1-wf-2", "#s1-wf-3", "#s1-wf-4", "#s1-wf-5", "#s1-wf-6", "#s1-wf-7", "#s1-wf-8"];
        wfSeq.forEach((sel, i) => {
          tl.to(sel, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, S1 + 0.15 + i * 0.18);
        });

        // Pin entry — tilt within tokenized range, no counter-rotation
        tl.fromTo(
          "#s1-pin",
          { opacity: 0, y: -14, rotation: -10 },
          { opacity: 1, y: 0, rotation: -10, duration: DUR.med, ease: EASE.entry },
          S1 + 0.1,
        );

        // Chip + paper-settle drift on the whole wireframe card
        tl.fromTo(
          "#s1-wire-wrap",
          { opacity: 0, rotation: 0.9, y: -10 },
          { opacity: 1, rotation: 0.9, y: 0, duration: DUR.slow, ease: EASE.entry },
          S1 + 0,
        );

        // Tear-away — scale-swap-transition style detach (write-on clip-path)
        const TEAR_START = S1 + 1.9;
        tl.to(
          "#s1-tear-fragment",
          {
            x: 90,
            opacity: 0,
            duration: DUR.med,
            ease: EASE.emphasis,
            clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, 6% 86%, 0% 74%, 8% 60%, 2% 46%, 9% 32%, 0% 18%)",
          },
          TEAR_START,
        );

        // stillness-before-climax — 0.4s hold on the gap (scene 1 is one of the 2 allowed scenes)
        const GAP_HOLD_END = TEAR_START + DUR.med + 0.4;

        // Hero number snaps in on EASE.entry
        tl.fromTo(
          "#s1-hero-number",
          { opacity: 0, scale: 0.85 },
          { opacity: 1, scale: 1, duration: DUR.med, ease: EASE.entry },
          GAP_HOLD_END,
        );

        // Scribble write-on (clip-path reveal left to right)
        tl.fromTo(
          ".s1-scribble",
          { opacity: 0, clipPath: "inset(0 100% 0 0)" },
          { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: DUR.med, ease: EASE.entry },
          GAP_HOLD_END + 0.25,
        );

        // ---- ambient drift on the wireframe card (subtle, scene-1 budget) ----
        tl.to(
          "#s1-wire-wrap",
          { y: -4, duration: 2.6, ease: EASE.drift, repeat: 1, yoyo: true },
          S1 + 1.0,
        );

        // ================= SCENE 2: term card + risk stack (6.037 - 13.546s) =================
        const S2 = T.scene_2;

        // scene_1 exits as scene_2 enters (no foreground overlap across the break)
        tl.to("#s1-stage", { opacity: 0, duration: DUR.med, ease: EASE.exit }, S2 - DUR.med);

        // coordinate-target-zoom — measure term card center, push toward it
        const W = 1920, H = 1080;
        const termRect = document.getElementById("g1-term-card").getBoundingClientRect();
        const TARGET_OFFSET_X = termRect.left + termRect.width / 2 - W / 2;
        const TARGET_OFFSET_Y = termRect.top + termRect.height / 2 - H / 2;
        const counterX = -TARGET_OFFSET_X;
        const counterY = -TARGET_OFFSET_Y;
        const maxScale = Math.min((0.88 * W) / termRect.width, (0.88 * H) / termRect.height);
        const ZOOM_SCALE = Math.min(1.18, maxScale);

        // term card arrives
        tl.fromTo(
          "#g1-term-card",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: DUR.slow, ease: EASE.entry },
          S2 + 0,
        );

        // stamp stack — tight stagger, total <= 500ms
        ["#s2-stamp-1", "#s2-stamp-2", "#s2-stamp-3"].forEach((sel, i) => {
          tl.fromTo(
            sel,
            { opacity: 0, y: 20, scale: 0.92, rotation: -4 },
            { opacity: 1, y: 0, scale: 1, rotation: -4, duration: 0.32, ease: EASE.emphasis },
            S2 + 0.3 + i * 0.16,
          );
        });

        // stat-counter card reveal
        tl.fromTo(

          "#s2-scribble",

        // icon 3: grid blocks pulse in sequence

          { opacity: 0, y: 14 },
